<!doctype html>
<html lang="si">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#E11D48"/>
  <title>Profile - Transport Management</title>
  <link rel="stylesheet" href="assets/styles.css"/>
  <script src="assets/config.js"></script>
  <script src="assets/app.js"></script>
</head>
<body>

<header>
  <h1>👤 Profile</h1>
  <div style="display:flex; gap:8px; align-items:center;">
    <button class="btn ghost small" onclick="history.back()">⬅️ Back</button>
    <button class="btn secondary small" onclick="logout()">Logout</button>
  </div>
</header>

<main class="container">
  <div class="card elevated" style="margin-bottom:14px;">
    <h2 class="h2">මගේ ගිණුම</h2>
    <hr/>
    <div id="meBox" class="small">Loading...</div>
  </div>

  <div class="card elevated">
    <h2 class="h2">🔐 Two‑Factor Authentication (2FA)</h2>
    <p class="mini">Authenticator app (TOTP) 2FA enable/disable. Backend support නැත්තම් “Not available” ලෙස පෙන්වයි.</p>
    <hr/>
    <div id="twofaStatus" class="alert info">Loading...</div>

    <div class="btnrow" style="margin-top:12px;">
      <button class="btn btn-primary" onclick="start2FA()">Enable / Setup</button>
      <button class="btn secondary" onclick="disable2FA()">Disable</button>
      <button class="btn ghost" onclick="refresh2FA()">Refresh</button>
    </div>

    <div id="twofaBox" style="margin-top:12px;"></div>
  </div>
</main>

<script>
function esc(s){ return String(s??'').replace(/[&<>"']/g, (c)=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

async function guardAny(){
  const r = await loadMe();
  if(!r || !r.me){ location.href="login.html"; return null; }
  return r.me;
}

async function init(){
  const me = await guardAny();
  if(!me) return;
  document.getElementById("meBox").innerHTML =
    `<div><strong>Email:</strong> ${esc(me.email||'')}</div>
     <div><strong>Role:</strong> ${esc(me.role||'')}</div>`;
  await refresh2FA();
}

async function refresh2FA(){
  const st = document.getElementById("twofaStatus");
  const box = document.getElementById("twofaBox");
  box.innerHTML = "";
  try{
    const d = await api("/auth/2fa/status");
    st.className = d.enabled ? "alert ok" : "alert warn";
    st.textContent = d.enabled ? "✅ 2FA Enabled" : "⚠️ 2FA Disabled";
  }catch(e){
    st.className = "alert info";
    st.textContent = "ℹ️ 2FA Not available (backend endpoint missing)";
  }
}

async function start2FA(){
  const box = document.getElementById("twofaBox");
  box.innerHTML = "";
  try{
    const d = await api("/auth/2fa/setup", { method:"POST" });
    box.innerHTML =
      `<div class="card soft" style="margin-top:10px;">
        <div class="small"><strong>Secret:</strong> <code>${esc(d.secret||'')}</code></div>
        <div class="mini" style="margin-top:6px;">Authenticator app එකට add කරලා, verify code එක submit කරන්න.</div>
        <div style="margin-top:10px;">
          <label>Verify code</label>
          <input id="vcode" placeholder="123456" inputmode="numeric"/>
        </div>
        <div class="btnrow" style="margin-top:10px;">
          <button class="btn btn-primary" onclick="verify2FA()">Verify & Enable</button>
        </div>
      </div>`;
  }catch(e){ toast("❌ "+e.message); }
}

async function verify2FA(){
  const code = document.getElementById("vcode")?.value?.trim();
  if(!code){ toast("⚠️ Code එක දාන්න"); return; }
  try{
    await api("/auth/2fa/verify", { method:"POST", body: JSON.stringify({ code }) });
    toast("✅ 2FA Enabled");
    document.getElementById("twofaBox").innerHTML = "";
    await refresh2FA();
  }catch(e){ toast("❌ "+e.message); }
}

async function disable2FA(){
  if(!confirm("2FA Disable කරන්නද?")) return;
  try{
    await api("/auth/2fa/disable", { method:"POST" });
    toast("✅ Disabled");
    await refresh2FA();
  }catch(e){ toast("❌ "+e.message); }
}

init().catch(e=>{ console.error(e); location.href="login.html"; });
</script>

</body>
</html>
